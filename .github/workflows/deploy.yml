# Publica o Astrofeet na VPS (astrofeet.spawn77.com).
# Build no runner do GitHub → envio por SSH (só execução de comando, sem
# scp/sftp nem encaminhamento de portas) → deploy/remote-deploy.sh na VPS.
#
# Segredos (Settings → Secrets and variables → Actions → New repository secret):
#   DEPLOY_SSH_KEY            OBRIGATÓRIO: chave privada dedicada do usuário claude-deploy
#   DEPLOY_KNOWN_HOSTS        opcional: `ssh-keyscan -t ed25519 137.131.146.32`; sem ele, a identidade é lida a cada deploy
#   ASTROFEET_AUTH_SECRET     opcional (>= 32): sem ele, a VPS gera e guarda um
#   ASTROFEET_ADMIN_EMAIL     opcional, junto com a senha: conta de administrador da loja
#   ASTROFEET_ADMIN_PASSWORD  opcional (>= 12)
name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: 137.131.146.32
  DEPLOY_USER: claude-deploy
  DEPLOY_PATH: /home/claude-deploy/site
  APP_PORT: "3100"
  PUBLIC_URL: https://astrofeet.spawn77.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Conferir segredos
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ASTROFEET_AUTH_SECRET: ${{ secrets.ASTROFEET_AUTH_SECRET }}
          ASTROFEET_ADMIN_EMAIL: ${{ secrets.ASTROFEET_ADMIN_EMAIL }}
          ASTROFEET_ADMIN_PASSWORD: ${{ secrets.ASTROFEET_ADMIN_PASSWORD }}
        run: |
          bad=0
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "::error::Falta o segredo DEPLOY_SSH_KEY: a chave privada do claude-deploy (ver docs/DEPLOY.md)"; bad=1; }
          [ -z "$ASTROFEET_AUTH_SECRET" ] || [ "${#ASTROFEET_AUTH_SECRET}" -ge 32 ] || { echo "::error::ASTROFEET_AUTH_SECRET precisa de >= 32 caracteres (ou apague o segredo)"; bad=1; }
          [ -z "$ASTROFEET_ADMIN_EMAIL$ASTROFEET_ADMIN_PASSWORD" ] || { [ -n "$ASTROFEET_ADMIN_EMAIL" ] && [ "${#ASTROFEET_ADMIN_PASSWORD}" -ge 12 ]; } ||
            { echo "::error::Admin: defina ASTROFEET_ADMIN_EMAIL e ASTROFEET_ADMIN_PASSWORD (>= 12 caracteres) juntos"; bad=1; }
          [ -n "$ASTROFEET_ADMIN_EMAIL" ] || echo "::notice::Sem ASTROFEET_ADMIN_EMAIL/PASSWORD: a loja sobe sem conta de administrador (dá para adicionar depois)."
          exit $bad

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar e verificar
        run: |
          npm ci
          npm run typecheck
          npm run lint

      - name: Build
        run: npm run build

      - name: Empacotar
        run: tar -C .next/standalone -czf release.tgz . && ls -lh release.tgz

      - name: Preparar SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 20 -t ed25519 "$DEPLOY_HOST" 2>/dev/null > ~/.ssh/known_hosts
            [ -s ~/.ssh/known_hosts ] || { echo "::error::$DEPLOY_HOST não respondeu na porta 22"; exit 1; }
            echo "::notice::Identidade da VPS (salve em DEPLOY_KNOWN_HOSTS para fixá-la): $(cat ~/.ssh/known_hosts)"
          fi
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host vps
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ClearAllForwardings yes
            ServerAliveInterval 15
          CFG

      - name: Enviar release e configuração
        env:
          ASTROFEET_AUTH_SECRET: ${{ secrets.ASTROFEET_AUTH_SECRET }}
          ASTROFEET_ADMIN_EMAIL: ${{ secrets.ASTROFEET_ADMIN_EMAIL }}
          ASTROFEET_ADMIN_PASSWORD: ${{ secrets.ASTROFEET_ADMIN_PASSWORD }}
        run: |
          ssh vps "mkdir -p '$DEPLOY_PATH/incoming' '$DEPLOY_PATH/shared' && chmod 700 '$DEPLOY_PATH/shared'"
          ssh vps "cat > '$DEPLOY_PATH/incoming/release.tgz'" < release.tgz
          ssh vps "cat > '$DEPLOY_PATH/incoming/remote-deploy.sh' && chmod 700 '$DEPLOY_PATH/incoming/remote-deploy.sh'" < deploy/remote-deploy.sh
          # Segredos vão pelo stdin (nunca na linha de comando) para um .env com permissão 600.
          ASTROFEET_ALLOWED_ORIGINS="$PUBLIC_URL"
          for v in ASTROFEET_AUTH_SECRET ASTROFEET_ADMIN_EMAIL ASTROFEET_ADMIN_PASSWORD ASTROFEET_ALLOWED_ORIGINS; do
            [ -z "${!v}" ] || printf '%s=%q\n' "$v" "${!v}"
          done | ssh vps "umask 077 && cat > '$DEPLOY_PATH/shared/.env'"

      - name: Ativar na VPS
        run: ssh vps "bash '$DEPLOY_PATH/incoming/remote-deploy.sh' '$GITHUB_SHA' '$DEPLOY_PATH' '$APP_PORT'"

      - name: Publicar no proxy reverso
        # Único passo com root (sudo sem senha). O script vai pelo stdin, nunca fica num
        # diretório gravável pelo claude-deploy. Sem sudo, pula e vale o proxy já configurado.
        run: |
          if ssh vps "sudo -n true" 2>/dev/null; then
            ssh vps "sudo -n bash -s -- '${PUBLIC_URL#https://}' '$APP_PORT'" < deploy/setup-proxy.sh
          else
            echo "::notice::claude-deploy sem sudo sem senha; proxy reverso não alterado (docs/DEPLOY.md, passo 2)."
          fi

      - name: Checar site público
        continue-on-error: true # depende do proxy/DNS (docs/DEPLOY.md); não derruba o deploy
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/api/products" || true)
            [ "$code" = 200 ] && { echo "Site no ar: $PUBLIC_URL"; exit 0; }
            sleep 6
          done
          echo "::warning::$PUBLIC_URL ainda não responde (último status: $code). O app está rodando na VPS em 127.0.0.1:$APP_PORT; confira proxy reverso e DNS."
          exit 1

      - name: Limpar chave
        if: always()
        run: rm -f ~/.ssh/deploy_key
